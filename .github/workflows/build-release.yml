# Build workflow v2.52.59 — validates Mac update assets before publishing a release
name: Build & Release Electron App

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: electron-webrtc-example

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify macOS signing secrets
        if: matrix.os == 'macos-latest'
        run: |
          echo "Checking required signing secrets..."
          if [ -z "$CSC_LINK" ]; then echo "❌ CSC_LINK is MISSING"; exit 1; else echo "✅ CSC_LINK present (length: ${#CSC_LINK})"; fi
          if [ -z "$CSC_KEY_PASSWORD" ]; then echo "❌ CSC_KEY_PASSWORD is MISSING"; exit 1; else echo "✅ CSC_KEY_PASSWORD present"; fi
          if [ -z "$APPLE_ID" ]; then echo "❌ APPLE_ID is MISSING"; exit 1; else echo "✅ APPLE_ID present"; fi
          if [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then echo "❌ APPLE_APP_SPECIFIC_PASSWORD is MISSING"; exit 1; else echo "✅ APPLE_APP_SPECIFIC_PASSWORD present"; fi
          if [ -z "$APPLE_TEAM_ID" ]; then echo "❌ APPLE_TEAM_ID is MISSING"; exit 1; else echo "✅ APPLE_TEAM_ID present: $APPLE_TEAM_ID"; fi
          echo "Decoding CSC_LINK to verify it's valid base64..."
          echo "$CSC_LINK" | base64 --decode > /tmp/cert.p12 2>&1 && echo "✅ Base64 decode OK ($(wc -c < /tmp/cert.p12) bytes)" || echo "❌ Base64 decode FAILED"
          echo "Verifying .p12 with provided password..."
          openssl pkcs12 -in /tmp/cert.p12 -noout -passin pass:"$CSC_KEY_PASSWORD" && echo "✅ .p12 password OK" || echo "❌ .p12 password WRONG or file corrupt"
          rm -f /tmp/cert.p12
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Prepare macOS entitlements
        if: matrix.os == 'macos-latest'
        run: |
          if [ ! -f entitlements.mac.plist ]; then
            echo "⚠️ Missing entitlements.mac.plist — generating via python"
            python3 - <<'PY'
          import plistlib
          data = {
              'com.apple.security.cs.allow-jit': True,
              'com.apple.security.cs.allow-unsigned-executable-memory': True,
              'com.apple.security.cs.allow-dyld-environment-variables': True,
              'com.apple.security.cs.disable-library-validation': True,
              'com.apple.security.device.camera': True,
              'com.apple.security.device.audio-input': True,
              'com.apple.security.network.client': True,
              'com.apple.security.network.server': True,
          }
          with open('entitlements.mac.plist', 'wb') as f:
              plistlib.dump(data, f)
          print('✅ Generated entitlements plist')
          PY
          fi
          python3 - <<'PY'
          import plistlib
          with open('entitlements.mac.plist', 'rb') as f:
              plistlib.load(f)
          print('✅ Entitlements plist is readable')
          PY
          ls -l entitlements.mac.plist

      - name: Build Windows package
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS package with notarization retry
        if: matrix.os == 'macos-latest'
        run: |
          for attempt in 1 2 3; do
            echo "macOS build/notarization attempt ${attempt}/3"
            if npx electron-builder --publish never; then
              echo "✅ macOS build and notarization succeeded"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "❌ macOS build and notarization failed after 3 attempts"
              exit 1
            fi
            echo "⚠️ Apple notarization can return temporary HTTP 500 errors; retrying in $((attempt * 60)) seconds..."
            sleep $((attempt * 60))
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Validate Windows release assets
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          test -f dist/latest.yml
          ls dist/Security-Camera-Agent-Setup-*.exe

      - name: Validate macOS release assets
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          test -f dist/latest-mac.yml
          ls dist/Security-Camera-Agent*.zip
          ls dist/Security-Camera-Agent*.dmg

      - name: Upload Windows release assets
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            electron-webrtc-example/dist/latest.yml
            electron-webrtc-example/dist/Security-Camera-Agent-Setup-*.exe
            electron-webrtc-example/dist/*.blockmap
          if-no-files-found: error

      - name: Upload macOS release assets
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: |
            electron-webrtc-example/dist/latest-mac.yml
            electron-webrtc-example/dist/Security-Camera-Agent*.zip
            electron-webrtc-example/dist/Security-Camera-Agent*.dmg
            electron-webrtc-example/dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download validated release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate complete cross-platform release
        shell: bash
        run: |
          test -f release-assets/latest.yml
          test -f release-assets/latest-mac.yml
          ls release-assets/Security-Camera-Agent-Setup-*.exe
          ls release-assets/Security-Camera-Agent*.zip
          ls release-assets/Security-Camera-Agent*.dmg
          echo "✅ Windows and macOS update assets are present"

      - name: Publish GitHub release only after all assets exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./electron-webrtc-example/package.json').version")"
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — replacing assets"
            gh release upload "${TAG}" release-assets/* --clobber
          else
            echo "Creating complete release ${TAG}"
            gh release create "${TAG}" release-assets/* --target "${GITHUB_SHA}" --title "${VERSION}" --notes "AIGuard Camera ${VERSION}"
          fi
